:root{
  --font:'Google Sans','Google Sans Flex','Product Sans',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --accent:#ff5f52;--accent2:#ff8a6b;--accent-soft:rgba(255,95,82,.16);
  --c-parcours:var(--accent);--c-lecture:#0a84ff;--c-oreille:#bf5af2;--c-rythme:#ff9f0a;--c-clavier:#30d158;--c-piano:#ff375f;--c-reglages:#64748b;
  --good:#30d158;--bad:#ff453a;
  --ink:#201a1a;--ink2:rgba(32,26,26,.66);--ink3:rgba(32,26,26,.40);
  --bg-a:#f9f2ef;--bg-b:#f6ede9;--bg-c:#f9f3ef;
  --glass:rgba(255,255,255,.26);--glass-edge:rgba(255,255,255,.72);--glass-hi:rgba(255,255,255,.55);
  --card:rgba(255,255,255,.50);--card-edge:rgba(255,255,255,.78);--paper:rgba(255,255,255,.82);
  --sheet:rgba(255,246,242,.78);
  --shadow:0 12px 40px rgba(150,60,40,.16);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --kbh:clamp(150px,24vh,230px);--kbh-xl:clamp(220px,42vh,470px);
  color-scheme:light;
}
html[data-scheme=dark]{
  --ink:#f8f2f0;--ink2:rgba(248,242,240,.68);--ink3:rgba(248,242,240,.40);
  --bg-a:#201416;--bg-b:#181012;--bg-c:#1d1512;
  --glass:rgba(48,32,34,.34);--glass-edge:rgba(255,255,255,.20);--glass-hi:rgba(255,255,255,.14);
  --card:rgba(255,255,255,.08);--card-edge:rgba(255,255,255,.16);--paper:rgba(255,255,255,.10);
  --sheet:rgba(28,18,20,.80);
  --shadow:0 14px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background-color:var(--bg-b);background-image:linear-gradient(165deg,var(--bg-a) 0%,var(--bg-b) 55%,var(--bg-c) 100%);-webkit-text-size-adjust:100%}
body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;margin:0;font-family:var(--font);color:var(--ink);background:transparent;overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.2}
.bg .b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:#ff6b5c}
.bg .b2{width:38vmax;height:38vmax;right:-10vmax;top:16vh;background:#ffb25c}
.bg .b3{width:40vmax;height:40vmax;left:20vw;bottom:-22vmax;background:#ff7aa8}
.bg .b4{width:26vmax;height:26vmax;right:6vw;bottom:-8vmax;background:#9ccfff;opacity:.14}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
#app{position:relative;z-index:1;height:100%}
/* header */
.topbar{position:fixed;z-index:20;top:calc(10px + var(--safe-t));left:0;right:0;margin:0 auto;width:min(1000px,calc(100% - 24px - var(--safe-l) - var(--safe-r)));height:58px;border-radius:29px;display:flex;align-items:center;gap:12px;padding:0 10px 0 10px}
.topbar .mark{width:38px;height:38px;border-radius:11px;box-shadow:0 2px 10px rgba(120,30,20,.3);flex:none}
.topbar .vt{font-size:19px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:18px;font-weight:600;font-size:14px;background:var(--glass);border:1px solid var(--glass-edge);white-space:nowrap}
.chip svg{width:17px;height:17px}
.chip.flame svg{color:#ff9f0a}.chip.xp svg{color:var(--accent)}
.chip.upd{background:var(--accent);color:#fff;border-color:transparent}
/* dock */
.dock{position:fixed;z-index:20;bottom:calc(12px + var(--safe-b));left:0;right:0;margin:0 auto;width:-webkit-fit-content;width:fit-content;border-radius:34px;display:flex;gap:2px;padding:7px;max-width:calc(100% - 16px)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;padding:8px 6px 6px;border-radius:26px;font-size:11.5px;font-weight:600;color:var(--ink2);transition:background .18s,color .18s}
.dock button svg{width:25px;height:25px}
.dock button.on{background:var(--tint,var(--accent-soft));color:var(--tc,var(--accent))}
#view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(84px + var(--safe-t)) 0 calc(112px + var(--safe-b));z-index:1}
.wrap{max-width:1000px;margin:0 auto;padding:0 max(18px,var(--safe-l)) 0 max(18px,var(--safe-r))}
.vh{font-size:clamp(28px,4.4vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:6px 0 6px}
.vs{color:var(--ink2);font-size:16px;line-height:1.45;max-width:62ch;margin-bottom:18px}
.sec{margin:26px 0 12px;font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sec small{font-weight:500;color:var(--ink2);font-size:14px}
/* cards & buttons */
.card{background:var(--card);border:1px solid var(--card-edge);border-radius:26px;padding:18px 20px;-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 6px 24px rgba(150,60,40,.08)}
html[data-scheme=dark] .card{box-shadow:0 6px 24px rgba(0,0,0,.3)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:23px;font-weight:600;font-size:16px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--c,var(--accent2)),var(--c,var(--accent)));color:#fff;border-color:rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:0 8px 22px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.big{min-height:58px;font-size:18px;padding:0 30px;border-radius:29px}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:18px}
.btn[disabled],.btn.off{opacity:.42;pointer-events:none}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:12.5px;font-weight:600;background:var(--glass);border:1px solid var(--glass-edge)}
.pill.ok{background:rgba(48,209,88,.2);color:#1f9d45;border-color:rgba(48,209,88,.35)}
html[data-scheme=dark] .pill.ok{color:#5ee08a}
.pill.todo{background:rgba(255,159,10,.2);color:#b86e00;border-color:rgba(255,159,10,.4)}
html[data-scheme=dark] .pill.todo{color:#ffc15a}
.muted{color:var(--ink2)}.small{font-size:13.5px}
.seg{display:inline-flex;padding:4px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-edge);gap:2px;flex-wrap:wrap}
.seg button{padding:8px 16px;border-radius:16px;font-weight:600;font-size:14.5px;color:var(--ink2);min-height:36px}
.seg button.on{background:var(--c,var(--accent));color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* tiles (parcours) */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media(max-width:640px){.hero{grid-template-columns:1fr}}
.ring{position:relative;display:grid;place-items:center}
.ring svg{display:block}
.ring .rl{position:absolute;text-align:center;line-height:1.1}
.ring .rl b{font-size:26px;display:block}.ring .rl span{font-size:12px;color:var(--ink2)}
.unit{margin-top:26px}
.unit-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.unit-h .dot{width:12px;height:12px;border-radius:50%;background:var(--uc)}
.unit-h h3{font-size:21px;font-weight:700;letter-spacing:-.015em}
.unit-h .muted{font-size:14px}
.lesson{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:16px 18px 14px;border-radius:24px;background:var(--card);border:1px solid var(--card-edge);min-height:132px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:transform .12s}
.lesson:active{transform:scale(.98)}
.lesson .num{font-size:13px;font-weight:700;color:var(--uc)}
.lesson .t{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.lesson .s{font-size:13.5px;color:var(--ink2);line-height:1.35}
.lesson .bd{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap;padding-top:6px}
.lesson.locked{opacity:.5}
.lesson.done{border-color:var(--uc)}
.lesson.mastered{background:linear-gradient(160deg,var(--card),var(--accent-soft))}
.lesson .lk{position:absolute;right:14px;top:14px;width:20px;height:20px;color:var(--ink3)}
.stars{display:inline-flex;gap:2px;color:#ffb800}
.stars svg{width:15px;height:15px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:stretch;padding:calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b));background:rgba(20,6,6,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .22s}
.sheet.in{opacity:1}
.sheet-card{width:min(1040px,100%);display:flex;flex-direction:column;border-radius:34px;background:var(--sheet);border:1px solid var(--glass-edge);box-shadow:0 24px 80px rgba(0,0,0,.35),inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(36px) saturate(1.8);backdrop-filter:blur(36px) saturate(1.8);overflow:hidden;transform:translateY(18px) scale(.985);transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.sheet.in .sheet-card{transform:none}
.sh-top{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.sh-top .ttl{font-weight:700;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-edge);flex:none}
.iconbtn svg{width:20px;height:20px}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 22px 22px}
.track{flex:1;height:14px;border-radius:7px;background:var(--glass);border:1px solid var(--glass-edge);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--c,var(--accent2)),var(--c,var(--accent)));transition:width .3s}
.stage{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:stretch;padding-top:6px}
.q{font-size:clamp(22px,3.2vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.2;text-align:center}
.q small{display:block;font-size:15px;font-weight:500;color:var(--ink2);margin-top:6px;letter-spacing:0}
.learn h2{font-size:clamp(24px,3.6vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.learn p,.learn li{font-size:17.5px;line-height:1.5;color:var(--ink)}
.learn p+p{margin-top:10px}
.learn ul{margin:8px 0 0;padding-left:22px}.learn li+li{margin-top:5px}
.learn b{font-weight:700}
.paper{background:var(--paper);border-radius:22px;padding:10px 12px;border:1px solid var(--card-edge);display:grid;place-items:center}
.staff{width:100%;max-width:640px;height:auto;color:var(--ink);display:block}
.staff .hl{fill:var(--c,var(--accent))}.staff .okc{fill:var(--good)}.staff .badc{fill:var(--bad)}
.staff text{font-family:'Bravura';user-select:none}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:620px;margin:0 auto;width:100%}
.choices.c3{grid-template-columns:repeat(3,1fr)}.choices.c4{grid-template-columns:repeat(4,1fr)}
.choice{min-height:68px;padding:10px 12px;border-radius:22px;font-size:20px;font-weight:700;background:var(--card);border:1.5px solid var(--card-edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .1s,background .15s}
.choice:active{transform:scale(.97)}
.choice.ok{background:rgba(48,209,88,.28);border-color:var(--good)}
.choice.bad{background:rgba(255,69,58,.24);border-color:var(--bad)}
.choice small{display:block;font-size:13px;font-weight:500;color:var(--ink2)}
.fb{display:none;margin:0 14px 14px;padding:14px 16px 14px 20px;border-radius:26px;align-items:center;gap:14px;border:1px solid var(--glass-edge)}
.fb.show{display:flex}
.fb.ok{background:rgba(48,209,88,.26)}.fb.bad{background:rgba(255,69,58,.24)}
.fb .ft{flex:1;min-width:0}.fb .ft b{display:block;font-size:18px}.fb .ft span{font-size:15px;color:var(--ink2)}
.foot{padding:0 14px 14px;display:flex;justify-content:center}
.foot .btn{min-width:min(420px,100%)}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.07)}}
/* keyboard */
.kbwrap{width:100%;padding:0}
.kb{position:relative;width:100%;height:var(--kbh);touch-action:none;border-radius:6px 6px 18px 18px;user-select:none;-webkit-user-select:none}
.kb .k{position:absolute;top:0;transition:background .08s,box-shadow .08s}
.kb .w{height:100%;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(247,243,241,.94) 70%,rgba(232,226,224,.95));border-left:1px solid rgba(60,30,30,.16);border-right:1px solid rgba(255,255,255,.5);border-radius:0 0 10px 10px;box-shadow:inset 0 -6px 10px rgba(120,80,70,.12),0 2px 6px rgba(0,0,0,.08)}
.kb .w:first-child{border-left:0;border-radius:6px 0 10px 18px}
.kb .w:last-of-type{border-radius:0 6px 18px 10px}
.kb .b{height:62%;z-index:2;background:linear-gradient(180deg,#46464e,#17171b 55%,#0c0c0e);border-radius:0 0 8px 8px;box-shadow:0 5px 8px rgba(0,0,0,.4),inset 0 -5px 6px rgba(255,255,255,.1),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.06)}
.kb .k .lb{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:clamp(11px,1.6vw,15px);font-weight:700;color:rgba(40,25,25,.62);pointer-events:none}
.kb .b .lb{bottom:8px;font-size:clamp(9px,1.2vw,12px);color:rgba(255,255,255,.7)}
.kb .k .fn{position:absolute;left:50%;top:10px;transform:translateX(-50%);min-width:26px;height:26px;border-radius:13px;display:none;place-items:center;font-size:14px;font-weight:700;background:var(--c,var(--accent));color:#fff;pointer-events:none}
.kb .b .fn{top:auto;bottom:34px}
.kb .k.hasfn .fn{display:grid}
.kb .w.on{background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:inset 0 -3px 8px rgba(0,0,0,.2)}
.kb .b.on{background:linear-gradient(180deg,var(--accent),#7a1d12);}
.kb .w.hint{background:linear-gradient(180deg,rgba(255,255,255,.96),var(--accent-soft) 85%)}
.kb .b.hint{box-shadow:0 0 0 3px var(--accent),0 5px 8px rgba(0,0,0,.4)}
.kb .w.target{background:linear-gradient(180deg,#fff,rgba(10,132,255,.34))}
.kb .b.target{background:linear-gradient(180deg,#2f6bd6,#123c86)}
.kb .w.ok{background:linear-gradient(180deg,#eaffef,rgba(48,209,88,.7))}.kb .b.ok{background:linear-gradient(180deg,#2cc055,#0f6a29)}
.kb .w.bad{background:linear-gradient(180deg,#fff0ef,rgba(255,69,58,.7))}.kb .b.bad{background:linear-gradient(180deg,#e0453b,#7a120c)}
.kb .w.dim{filter:brightness(.88)}
.kb .w.g1{background:linear-gradient(180deg,#fff,rgba(10,132,255,.28))}.kb .w.g2{background:linear-gradient(180deg,#fff,rgba(255,159,10,.32))}
.kb .b.g1{background:linear-gradient(180deg,#2f6bd6,#123c86)}.kb .b.g2{background:linear-gradient(180deg,#c47600,#6e4100)}
.kb .w.pc{background:linear-gradient(180deg,#fff,var(--tc,rgba(191,90,242,.35)))}
.kbbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
/* falling */
.fall{position:relative;width:100%;flex:1;min-height:200px;border-radius:22px 22px 0 0;overflow:hidden;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.08));border:1px solid var(--glass-edge);border-bottom:0}
.fall canvas{position:absolute;inset:0;width:100%;height:100%}
.fall .big{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:700;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.4);pointer-events:none}
/* rhythm */
.tapzone{display:grid;place-items:center;height:clamp(150px,26vh,240px);border-radius:34px;background:linear-gradient(160deg,var(--glass-hi),var(--glass));border:1.5px solid var(--glass-edge);font-size:26px;font-weight:700;touch-action:none;color:var(--ink2);transition:transform .06s,background .1s}
.tapzone.hit{transform:scale(.985);background:var(--c,var(--accent-soft))}
.beats{display:flex;gap:12px;justify-content:center}
.beats i{width:22px;height:22px;border-radius:50%;background:var(--glass);border:1.5px solid var(--glass-edge);transition:transform .08s,background .08s}
.beats i.on{background:var(--c,var(--accent));transform:scale(1.35);border-color:transparent}
.beats i.acc{width:28px;height:28px}
.pads{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pad{height:clamp(130px,22vh,200px);border-radius:30px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font-size:30px;font-weight:700;background:var(--card);border:1.5px solid var(--card-edge);touch-action:none;position:relative;transition:background .08s,transform .08s}
.pad.down{background:var(--c,var(--accent-soft));transform:scale(.97)}
.pad.target{outline:4px solid var(--c,var(--accent));outline-offset:3px}
.pad.bad{background:rgba(255,69,58,.35)}
.seqchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seqchips span{min-width:42px;height:42px;border-radius:21px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--glass);border:1px solid var(--glass-edge)}
.seqchips span.cur{background:var(--c,var(--accent));color:#fff}.seqchips span.done{opacity:.35}
/* mic */
.meter{height:12px;border-radius:6px;background:var(--glass);border:1px solid var(--glass-edge);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#30d158,#ffd60a,#ff453a);transition:width .06s}
.bignote{font-size:clamp(64px,12vw,120px);font-weight:700;letter-spacing:-.04em;line-height:1;text-align:center}
.needle{position:relative;height:60px;margin:6px auto 0;max-width:420px}
.needle .ax{position:absolute;left:0;right:0;top:28px;height:4px;border-radius:2px;background:linear-gradient(90deg,#ff453a,#ffd60a 35%,#30d158 50%,#ffd60a 65%,#ff453a);opacity:.7}
.needle .nd{position:absolute;top:8px;width:6px;height:44px;border-radius:3px;background:var(--ink);left:50%;transition:left .08s}
.needle .zero{position:absolute;left:50%;top:0;width:2px;height:12px;background:var(--ink3)}
/* settings */
.set{display:flex;flex-direction:column;gap:2px}
.srow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--card-edge);min-height:56px}
.srow:last-child{border-bottom:0}
.srow .sl{flex:1;min-width:0}.srow .sl b{display:block;font-weight:600;font-size:16px}.srow .sl span{display:block;color:var(--ink2);font-size:13.5px;margin-top:2px;line-height:1.35}
.tog{position:relative;width:54px;height:32px;border-radius:16px;background:rgba(120,120,128,.32);transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.tog.on{background:var(--good)}.tog.on::after{transform:translateX(22px)}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;width:min(240px,46vw)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(120,120,128,.35)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(120,120,128,.35)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.swatch.on{border-color:var(--ink)}
.cl{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--ink2);line-height:1.45}
textarea{width:100%;min-height:90px;border-radius:16px;border:1px solid var(--glass-edge);background:var(--paper);color:var(--ink);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
/* toasts */
#toasts{position:fixed;z-index:90;top:calc(76px + var(--safe-t));left:0;right:0;margin:0 auto;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 24px))}
.toast{pointer-events:auto;padding:12px 18px;border-radius:22px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:12px;animation:tin .3s cubic-bezier(.2,.9,.3,1)}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.96)}}
.dlg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(10,0,0,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:20px}
.dlg .card{width:min(420px,100%);background:var(--sheet);padding:24px}
.dlg h3{font-size:21px;margin-bottom:8px}.dlg p{color:var(--ink2);line-height:1.45;margin-bottom:18px}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--card-edge);text-align:left}
table.t th{font-weight:700;color:var(--ink2);font-size:13.5px}
.flash{animation:flash .5s}
@keyframes flash{from{background:var(--accent-soft)}}
.fcard{min-height:230px;display:grid;place-items:center;text-align:center;padding:26px;border-radius:30px;background:var(--card);border:1px solid var(--card-edge);font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.3;letter-spacing:-.01em}
.fcard .ans{font-weight:500;font-size:clamp(17px,2.4vw,22px);color:var(--ink);line-height:1.45}
.bars{display:flex;align-items:flex-end;gap:5px;height:64px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--c,var(--accent));min-height:4px;opacity:.9}
@media (max-width:760px){.dock button{min-width:56px;font-size:10.5px}.dock button svg{width:23px;height:23px}.choices.c4{grid-template-columns:repeat(2,1fr)}.sh-body{padding:6px 14px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.choice[disabled]{pointer-events:none}
.staff .hl{color:var(--c,var(--accent))}.staff .okc{color:var(--good)}.staff .badc{color:var(--bad)}
.staff text.nm{font-family:var(--font)}
.kb .w.pc2{background:linear-gradient(180deg,#fff,rgba(191,90,242,.35))}
.fingerrow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.fingerrow div{padding:14px 6px;border-radius:20px;background:var(--card);border:1px solid var(--card-edge);text-align:center}
.fingerrow b{display:block;font-size:30px;color:var(--c,var(--accent))}.fingerrow span{font-size:13px;color:var(--ink2)}
.resbig{font-size:clamp(34px,6vw,54px);font-weight:700;letter-spacing:-.03em;text-align:center}
.listrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:var(--card);border:1px solid var(--card-edge);text-align:left;width:100%}
.listrow .lt{flex:1;min-width:0}.listrow .lt b{display:block;font-size:17px;font-weight:700}.listrow .lt span{font-size:13.5px;color:var(--ink2)}
.listrow .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--tint,var(--accent-soft));color:var(--tc,var(--accent));flex:none}
.listrow .ic svg{width:24px;height:24px}
.stack{display:flex;flex-direction:column;gap:10px}
.sh-body.song{display:flex;flex-direction:column;gap:10px;padding:4px 14px 14px;overflow:hidden}
.sh-body.song .fall{flex:1;min-height:140px}
.sh-body.song .kbbar{margin:0}
.upd-st{font-size:14px;color:var(--ink2);line-height:1.4}
.unit-h .dot{display:block;flex:none}
svg:not(.staff):not([width]){width:20px;height:20px}
.seg{align-self:flex-start;max-width:100%}
.listrow>svg{width:22px;height:22px;flex:none;color:var(--ink3)}

/* ---- Fonds (réglage « Fond ») ---- */
.bg i{display:none}
html[data-bg=aurora] .bg i{display:block;opacity:.16}
.bg::before,.bg::after{content:"";position:absolute;pointer-events:none;display:none}
html[data-bg=staff] .bg{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22150%22 viewBox=%220 0 280 150%22%3E%3Cg stroke=%22rgba(110,60,50,.075)%22 stroke-width=%221%22%3E%3Cline x1=%220%22 y1=%2230%22 x2=%22280%22 y2=%2230%22/%3E%3Cline x1=%220%22 y1=%2240%22 x2=%22280%22 y2=%2240%22/%3E%3Cline x1=%220%22 y1=%2250%22 x2=%22280%22 y2=%2250%22/%3E%3Cline x1=%220%22 y1=%2260%22 x2=%22280%22 y2=%2260%22/%3E%3Cline x1=%220%22 y1=%2270%22 x2=%22280%22 y2=%2270%22/%3E%3Cline x1=%220.5%22 y1=%2230%22 x2=%220.5%22 y2=%2270%22/%3E%3C/g%3E%3C/svg%3E");background-size:280px 150px;}
html[data-scheme=dark][data-bg=staff] .bg{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22150%22 viewBox=%220 0 280 150%22%3E%3Cg stroke=%22rgba(255,255,255,.07)%22 stroke-width=%221%22%3E%3Cline x1=%220%22 y1=%2230%22 x2=%22280%22 y2=%2230%22/%3E%3Cline x1=%220%22 y1=%2240%22 x2=%22280%22 y2=%2240%22/%3E%3Cline x1=%220%22 y1=%2250%22 x2=%22280%22 y2=%2250%22/%3E%3Cline x1=%220%22 y1=%2260%22 x2=%22280%22 y2=%2260%22/%3E%3Cline x1=%220%22 y1=%2270%22 x2=%22280%22 y2=%2270%22/%3E%3Cline x1=%220.5%22 y1=%2230%22 x2=%220.5%22 y2=%2270%22/%3E%3C/g%3E%3C/svg%3E")}
html[data-bg=staff] .bg::after{display:block;content:"\E050";font-family:'Bravura';font-size:78vmin;line-height:1;right:2vw;bottom:-10vmin;color:var(--accent);opacity:.045}
html[data-bg=keys] .bg::before{display:block;box-shadow:inset 0 70px 60px -30px var(--bg-b);left:0;right:0;bottom:0;height:30vh;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22150%22 viewBox=%220 0 140 150%22%3E%3Cg stroke=%22rgba(110,60,50,.12)%22 stroke-width=%221%22%3E%3Cline x1=%220%22 y1=%220%22 x2=%220%22 y2=%22150%22/%3E%3Cline x1=%2220%22 y1=%220%22 x2=%2220%22 y2=%22150%22/%3E%3Cline x1=%2240%22 y1=%220%22 x2=%2240%22 y2=%22150%22/%3E%3Cline x1=%2260%22 y1=%220%22 x2=%2260%22 y2=%22150%22/%3E%3Cline x1=%2280%22 y1=%220%22 x2=%2280%22 y2=%22150%22/%3E%3Cline x1=%22100%22 y1=%220%22 x2=%22100%22 y2=%22150%22/%3E%3Cline x1=%22120%22 y1=%220%22 x2=%22120%22 y2=%22150%22/%3E%3Cline x1=%22140%22 y1=%220%22 x2=%22140%22 y2=%22150%22/%3E%3C/g%3E%3Cg fill=%22rgba(80,40,35,.09)%22%3E%3Crect x=%2214%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3Crect x=%2234%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3Crect x=%2274%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3Crect x=%2294%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3Crect x=%22114%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3C/g%3E%3C/svg%3E");background-size:140px 150px;background-position:bottom left;background-repeat:repeat-x}
html[data-scheme=dark][data-bg=keys] .bg::before{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22150%22 viewBox=%220 0 140 150%22%3E%3Cg stroke=%22rgba(255,255,255,.08)%22 stroke-width=%221%22%3E%3Cline x1=%220%22 y1=%220%22 x2=%220%22 y2=%22150%22/%3E%3Cline x1=%2220%22 y1=%220%22 x2=%2220%22 y2=%22150%22/%3E%3Cline x1=%2240%22 y1=%220%22 x2=%2240%22 y2=%22150%22/%3E%3Cline x1=%2260%22 y1=%220%22 x2=%2260%22 y2=%22150%22/%3E%3Cline x1=%2280%22 y1=%220%22 x2=%2280%22 y2=%22150%22/%3E%3Cline x1=%22100%22 y1=%220%22 x2=%22100%22 y2=%22150%22/%3E%3Cline x1=%22120%22 y1=%220%22 x2=%22120%22 y2=%22150%22/%3E%3Cline x1=%22140%22 y1=%220%22 x2=%22140%22 y2=%22150%22/%3E%3C/g%3E%3Cg fill=%22rgba(255,255,255,.06)%22%3E%3Crect x=%2214%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3Crect x=%2234%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3Crect x=%2274%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3Crect x=%2294%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3Crect x=%22114%22 y=%220%22 width=%2212%22 height=%2292%22 rx=%223%22/%3E%3C/g%3E%3C/svg%3E")}

.topbar .setbtn{width:40px;height:40px;flex:none;background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2)}
.topbar .setbtn.on{background:var(--accent-soft);color:var(--accent)}
/* ---- Fond « Sobre » : blanc uni / noir uni ---- */
html[data-bg=solid] body{background:#fff}
html[data-bg=solid] .bg{display:none}
html[data-bg=solid]{--glass:rgba(250,250,251,.82);--glass-edge:rgba(0,0,0,.09);--glass-hi:rgba(255,255,255,.9);--card:#f6f6f8;--card-edge:rgba(0,0,0,.07);--paper:#ffffff;--sheet:rgba(255,255,255,.94);--shadow:0 8px 30px rgba(0,0,0,.08)}
html[data-scheme=dark][data-bg=solid] body{background:#000}
html[data-scheme=dark][data-bg=solid]{--glass:rgba(24,24,26,.82);--glass-edge:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.08);--card:#141416;--card-edge:rgba(255,255,255,.08);--paper:#1a1a1c;--sheet:rgba(8,8,9,.95);--shadow:0 10px 36px rgba(0,0,0,.6)}
html[data-bg=solid] .paper{border-color:var(--card-edge)}

/* ---- Effets de verre désactivables (compatibilité d'affichage) ---- */
html[data-fx=off] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html[data-fx=off] .bg{display:none}
html[data-fx=off]{--glass:rgba(255,255,255,.92);--card:rgba(255,255,255,.9);--sheet:rgba(255,248,245,.99);--shadow:0 6px 22px rgba(120,50,30,.12)}
html[data-fx=off][data-scheme=dark]{--glass:rgba(40,28,30,.96);--card:rgba(255,255,255,.07);--sheet:rgba(24,16,18,.99);--shadow:0 8px 28px rgba(0,0,0,.5)}
html[data-bg=solid]{background-image:none;background-color:#fff}
html[data-scheme=dark][data-bg=solid]{background-color:#000}

/* ---- Clavier pleine largeur (v0.1.4) ---- */
.kbwrap{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);margin-right:0;padding:0}
.kbwrap .kb{border-radius:0}
.kbwrap .kb .w:first-child{border-radius:0 0 10px 0}
.sheet{padding:calc(10px + var(--safe-t)) 0 0}
.sheet-card{width:100%;border-radius:34px 34px 0 0;padding-bottom:var(--safe-b)}
.sh-body.song .fall,.sh-body.song .kb{margin-left:-14px;margin-right:-14px;width:calc(100% + 28px);max-width:none}
.sh-body.song .fall{border-radius:0;border-left:0;border-right:0}
.sh-body.song .kb{border-radius:0}
.credit{margin:22px 0 4px;text-align:center;font-size:12px;color:var(--ink3);letter-spacing:.01em}

/* ---- Barre de navigation vivante (v0.1.5) ---- */
.dock{position:fixed}
.dock .ind{position:absolute;top:7px;bottom:7px;left:0;width:0;border-radius:26px;background:var(--tint,var(--accent-soft));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 12px rgba(0,0,0,.06);transition:left .46s cubic-bezier(.34,1.32,.5,1),width .4s cubic-bezier(.34,1.2,.5,1),background .3s,opacity .25s;pointer-events:none}
.dock .ind.still{transition:none}
.dock .ind.none{opacity:0}
.dock button{position:relative;z-index:1;background:transparent!important;transition:color .25s,transform .14s}
.dock button:active{transform:scale(.92)}
.dock button svg{transition:transform .3s cubic-bezier(.34,1.5,.5,1)}
.dock button.on svg{transform:translateY(-1px) scale(1.06)}
.dock button.bump svg{animation:dockpop .5s cubic-bezier(.3,1.4,.5,1)}
.dock button[data-id=rythme].bump svg{animation:docktick .6s ease-out;transform-origin:50% 90%}
.dock button[data-id=oreille].bump svg{animation:dockwig .5s ease-out}
@keyframes dockpop{0%{transform:scale(.82) translateY(2px)}45%{transform:scale(1.26) translateY(-3px)}100%{transform:translateY(-1px) scale(1.06)}}
@keyframes docktick{0%{transform:rotate(-16deg)}30%{transform:rotate(13deg)}55%{transform:rotate(-7deg)}80%{transform:rotate(3deg)}100%{transform:rotate(0) translateY(-1px) scale(1.06)}}
@keyframes dockwig{0%{transform:scale(.9)}35%{transform:scale(1.2) rotate(-7deg)}65%{transform:scale(1.1) rotate(5deg)}100%{transform:translateY(-1px) scale(1.06)}}
.topbar{animation:topin .6s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes topin{from{opacity:0;top:calc(-14px + var(--safe-t))}}
#view .wrap{animation:viewin .28s ease backwards}
@keyframes viewin{from{opacity:0}}
.topbar .setbtn svg{transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.topbar .setbtn:active svg,.topbar .setbtn.on svg{transform:rotate(60deg)}

/* ---- Clavier immersif (v0.1.6) ---- */
/* feuilles d'exercice : texte en haut, « Continuer » au-dessus, grand clavier collé en bas */
.kbslot{display:none;flex:none}
.sheet-card.kbmode{padding-bottom:0}
.sheet-card.kbmode .kbslot{display:block;--kbh:calc(var(--kbh-xl) + var(--safe-b));position:relative}
.kbslot .kb{border-radius:0;box-shadow:0 -12px 34px rgba(0,0,0,.14)}
.kbslot .kb .lb{bottom:calc(14px + var(--safe-b))}
.sheet-card.kbmode .stage{gap:12px}
.sheet-card.kbmode .q{font-size:clamp(20px,2.6vw,27px)}
.sheet-card.kbmode .paper{padding:6px}
.sheet-card.kbmode .staff{max-height:30vh}
.sheet-card.kbmode .foot{padding-top:8px}
.sheet-card.kbmode .fb{margin-bottom:10px}
.sh-body.song .kb{height:clamp(190px,36vh,430px)}
/* onglet Clavier : clavier fixe en bas, commandes flottantes au-dessus */
.kbdock{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;align-items:center;gap:12px;--kbh:calc(var(--kbh-xl) + var(--safe-b));pointer-events:none}
.kbdock>*{pointer-events:auto}
.kbdock .kbwrap{width:100%;max-width:none;margin:0}
.kbdock .kb{border-radius:0;box-shadow:0 -14px 40px rgba(0,0,0,.14)}
.kbdock .kb .lb{bottom:calc(14px + var(--safe-b))}
.kbfloat{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:30px;margin:0 12px}
.kbfloat .btn.sm{min-height:40px}
html[data-kbview=on] #view{padding-bottom:calc(var(--kbh-xl) + 104px + var(--safe-b))}
.noteflash{position:fixed;left:0;right:0;bottom:calc(var(--kbh-xl) + var(--safe-b) + 96px);text-align:center;font-size:clamp(72px,11vw,150px);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--accent);opacity:0;pointer-events:none;z-index:2}
.noteflash.go{animation:nflash .9s ease-out}
@keyframes nflash{0%{opacity:0;transform:scale(.94)}14%{opacity:.5}100%{opacity:0;transform:scale(1.04)}}
/* la barre de navigation devient un rail latéral */
.dock[data-pos=side]{left:calc(12px + var(--safe-l));right:auto;bottom:auto;top:calc(84px + var(--safe-t));margin:0;width:auto;max-width:none;flex-direction:column;gap:4px;border-radius:34px}
.dock[data-pos=side] button{min-width:0;width:56px;height:56px;padding:0;justify-content:center;border-radius:28px}
.dock[data-pos=side] button span{display:none}
.dock[data-pos=side] button svg{width:27px;height:27px}
.dock[data-pos=side] .ind{border-radius:28px;transition:top .46s cubic-bezier(.34,1.32,.5,1),height .4s cubic-bezier(.34,1.2,.5,1),background .3s,opacity .25s}
html[data-dockpos=side] #view .wrap{padding-left:calc(88px + var(--safe-l))}
#view .wrap{transition:padding-left .5s cubic-bezier(.2,.9,.3,1) .12s}

/* v0.1.7 */
.dock button{flex:none}
.sheet-card.kbmode .foot{padding:12px 14px 28px}
.sheet-card.kbmode .fb{margin-bottom:22px}

.dock.morphing .ind,.dock.morphing button,.dock.morphing button svg{transition:none!important}
.dock.morphing button.bump svg{animation:none!important}

/* v0.1.8 : sortie vers le bas / entrée par le côté */
.dock.out-bottom{animation:dock-out-bottom .22s cubic-bezier(.5,0,1,1) forwards}
.dock.out-side{animation:dock-out-side .22s cubic-bezier(.5,0,1,1) forwards}
.dock.in-bottom{animation:dock-in-bottom .5s cubic-bezier(.2,.9,.3,1) backwards}
.dock.in-side{animation:dock-in-side .44s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes dock-out-bottom{to{bottom:-90px;opacity:0}}
@keyframes dock-out-side{to{left:-96px;opacity:0}}
@keyframes dock-in-bottom{from{bottom:-90px;opacity:0}}
@keyframes dock-in-side{from{left:-96px;opacity:0}}

/* v0.1.9 : rail compact + bulle « Retour » */
.dock[data-pos=side]{top:calc(128px + var(--safe-t));gap:2px}
.dock[data-pos=side] button{width:48px;height:48px;border-radius:24px}
.dock[data-pos=side] button svg{width:24px;height:24px}
.dock[data-pos=side] .ind{border-radius:24px}
.dock .backb{display:none;position:absolute;top:-52px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;place-items:center;color:var(--ink2);cursor:pointer;background:var(--bubble);border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);transition:transform .12s,color .2s}
.dock .backb:active{transform:scale(.9)}
.dock .backb svg{width:22px;height:22px}
.dock[data-pos=side] .backb{display:grid}
.dock.in-side .backb{animation:bpop .55s cubic-bezier(.3,1.5,.5,1) .22s backwards}
@keyframes bpop{from{opacity:0;transform:scale(.4)}}


/* v0.1.11 : bulle Retour dans le style du menu (verre, sans flou imbriqué) */
:root{--bubble:rgba(255,255,255,.7)}
html[data-scheme=dark]{--bubble:rgba(58,42,44,.82)}
html[data-bg=solid]{--bubble:#fafafb}
html[data-scheme=dark][data-bg=solid]{--bubble:#1a1a1c}
html[data-fx=off]{--bubble:rgba(255,255,255,.96)}
html[data-fx=off][data-scheme=dark]{--bubble:rgba(44,30,32,.98)}
.dock .backb:hover{color:var(--ink)}

</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<noscript>Piano a besoin de JavaScript pour fonctionner.</noscript>
<script>
'use strict';
const APP_VERSION = '0.1.11';
const CHANGELOG = [
  { v: '0.1.11', date: '2026-10-21', notes: [
    'La bulle « Retour » reprend le style du menu : même verre translucide, même bordure et même couleur d’icône.'
  ] },
  { v: '0.1.10', date: '2026-10-21', notes: [
    'La bulle « Retour » passe en couleur neutre (sombre en mode clair, claire en mode sombre) au lieu de la couleur d’accent.'
  ] },
  { v: '0.1.9', date: '2026-10-21', notes: [
    'Quand la navigation passe sur le côté, une bulle « Retour » apparaît au-dessus du rail et ramène à l’écran précédent.',
    'Le rail latéral est un peu plus compact pour laisser la place à la bulle sans toucher le clavier.'
  ] },
  { v: '0.1.8', date: '2026-10-21', notes: [
    'Animation de la barre de navigation simplifiée et plus légère : elle sort vers le bas, puis le rail entre par le côté (et inversement).'
  ] },
  { v: '0.1.7', date: '2026-10-21', notes: [
    'La barre de navigation se transforme maintenant en rail latéral (et inversement) : la barre change de forme et chaque icône glisse jusqu’à sa nouvelle place.',
    'Plus d’air entre le bouton « Continuer » et le clavier dans les exercices et les leçons.'
  ] },
  { v: '0.1.6', date: '2026-10-21', notes: [
    'Clavier immersif : beaucoup plus haut, collé au bas de l’écran et pleine largeur. Dans les exercices et les leçons, le texte est en haut, « Continuer » juste au-dessus du clavier.',
    'Sur l’écran Clavier, la barre de navigation glisse sur le côté pour laisser toute la place au clavier, et les commandes flottent juste au-dessus des touches.',
    'Nom de la note affiché en grand quand tu joues. Le réglage « Hauteur du clavier » agit sur ces nouvelles dimensions.'
  ] },
  { v: '0.1.5', date: '2026-10-21', notes: [
    'Barre de navigation plus vivante : pastille qui glisse d’un onglet à l’autre, petit rebond des icônes, retour tactile à l’appui, entrée en douceur.',

          for (let k = 1; st.yTop + 4 * sp + k * sp <= hd.y + 0.01; k++) s += line(it.x - 0.45 * sp, st.yTop + 4 * sp + k * sp, it.x + hw + 0.45 * sp, st.yTop + 4 * sp + k * sp, 1.3);

function Keyboard(opt = {}) {
  const o = Object.assign({ from: 60, to: 71, labels: cfg().kbLabels, sound: true, interactive: true, slide: true, onDown: null, onUp: null }, opt);
  const root = h('div', { class: 'kb' });
  let from = o.from, to = o.to, whites = [], blacks = [], wW = 7;
  const keys = new Map(), ptr = new Map(), voices = new Map();
  function labelFor(m) {
    const L = o.labels;
    if (L === 'none') return '';
    if (L === 'c') return pcOf(m) === 0 ? noteName(m, { oct: true }) : '';
    return noteName(m);
  }
  function build() {
    root.innerHTML = ''; keys.clear(); whites = []; blacks = [];
    if (isBlack(from)) from--; if (isBlack(to)) to++;
    for (let m = from; m <= to; m++) if (!isBlack(m)) whites.push(m);
    wW = 100 / whites.length;
    whites.forEach((m, i) => {
      const k = h('div', { class: 'k w', 'data-m': m, style: { left: (i * wW) + '%', width: wW + '%' } }, h('span', { class: 'fn' }), h('span', { class: 'lb' }, labelFor(m)));
      keys.set(m, k); root.append(k);
    });
    for (let m = from; m <= to; m++) if (isBlack(m)) {
      const i = whites.indexOf(m - 1), l = (i + 1) * wW - wW * 0.3;
      const k = h('div', { class: 'k b', 'data-m': m, style: { left: l + '%', width: (wW * 0.6) + '%' } }, h('span', { class: 'fn' }), h('span', { class: 'lb' }, labelFor(m)));
      keys.set(m, k); blacks.push({ m, l, w: wW * 0.6 }); root.append(k);
    }
  }
  function hit(e) {
    const r = root.getBoundingClientRect();
    const xp = (e.clientX - r.left) / r.width * 100, yp = clamp((e.clientY - r.top) / r.height, 0, 1);
    if (yp < 0.62) for (const b of blacks) if (xp >= b.l && xp <= b.l + b.w) return { m: b.m, y: yp };
    return { m: whites[clamp(Math.floor(xp / wW), 0, whites.length - 1)], y: yp };
  }
  function press(id, m, y) {
    const vel = 0.5 + 0.4 * y;
    ptr.set(id, m);
    if (o.sound) voices.set(id, Snd.noteOn(m, vel));
    const k = keys.get(m); if (k) k.classList.add('on');
    if (o.onDown) o.onDown(m, { vel, id });
  }
  function release(id) {
    if (!ptr.has(id)) return;
    const m = ptr.get(id); ptr.delete(id);
    const v = voices.get(id); if (v) { v.stop(); voices.delete(id); }
    if (![...ptr.values()].includes(m)) { const k = keys.get(m); if (k) k.classList.remove('on'); }
    if (o.onUp) o.onUp(m);
  }
  if (o.interactive) {
    root.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { root.setPointerCapture(e.pointerId); } catch (er) { /* ok */ }
      const r = hit(e); press(e.pointerId, r.m, r.y);
    });
    root.addEventListener('pointermove', e => {
      if (!o.slide || !ptr.has(e.pointerId)) return;
      const r = hit(e);
      if (r.m !== ptr.get(e.pointerId)) { release(e.pointerId); press(e.pointerId, r.m, r.y); }
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => root.addEventListener(ev, e => release(e.pointerId)));
    root.addEventListener('contextmenu', e => e.preventDefault());
  }
  build();
  const api = {
    el: root,
    mark(m, cls) { const k = keys.get(m); if (k) k.classList.add(cls); },
    unmark(m, cls) { const k = keys.get(m); if (k) k.classList.remove(cls); },
    clear(cls) { keys.forEach(k => k.classList.remove(cls)); },
    flash(m, cls, ms = 450) { api.mark(m, cls); setTimeout(() => api.unmark(m, cls), ms); },
    setFinger(m, n) { const k = keys.get(m); if (!k) return; k.classList.add('hasfn'); k.querySelector('.fn').textContent = n; },
    clearFingers() { keys.forEach(k => { k.classList.remove('hasfn'); }); },
    has: m => keys.has(m),
    range: () => [from, to],
    whites: () => whites.slice(),
    setRange(a, b) { from = a; to = b; build(); },
    setLabels(l) { o.labels = l; build(); },
    // géométrie en pixels (relative au clavier)
    geom(m) {
      const W = root.clientWidth, w = W / whites.length;
      if (!isBlack(m)) { const i = whites.indexOf(m); return i < 0 ? null : { x: i * w, w, black: false }; }
      const b = blacks.find(bk => bk.m === m); return b ? { x: b.l / 100 * W, w: b.w / 100 * W, black: true } : null;
    },
    // note jouée par le programme (démo) : lumière + son
    play(m, ms = 380, vel = 0.72, sound = true) {
      const k = keys.get(m); if (k) k.classList.add('on');
      const v = sound ? Snd.noteOn(m, vel) : null;
      setTimeout(() => { if (v) v.stop(); if (k && ![...ptr.values()].includes(m)) k.classList.remove('on'); }, ms);
    },
    releaseAll() { Array.from(ptr.keys()).forEach(release); },
    destroy() { api.releaseAll(); root.remove(); }
  };
  return api;
}
function kbRangeFor(notes, pad = 1) {
  let lo = Math.min(...notes), hi = Math.max(...notes);
  lo = Math.floor(lo / 12) * 12 - (lo % 12 === 0 && pad ? 0 : 0);
  hi = Math.ceil((hi + 1) / 12) * 12;
  if (hi - lo < 12) hi = lo + 12;
  return [lo, hi];
}
function kbRangeTight(notes) { // du Do en dessous jusqu’au Do au-dessus, sans excès
  let lo = Math.min(...notes), hi = Math.max(...notes);
  lo = lo - pcOf(lo); hi = hi + (12 - pcOf(hi)) % 12; if (pcOf(hi) !== 0) hi += 12 - pcOf(hi);
  if (hi - lo < 12) hi = lo + 12;
  return [lo, hi];
}

function N_SEQ(str) { return str.split(/\s+/).filter(Boolean).map(parseNote); }
const LESSON_BY_ID = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const lessonProg = id => S().progress.lessons[id] || {};
function lessonUnlocked(l) {
  if (cfg().unlockAll) return true;
  const i = LESSONS.indexOf(l);
  return i === 0 || !!lessonProg(LESSONS[i - 1].id).done;
}
function pendingPiano() { return LESSONS.filter(l => lessonProg(l.id).done && !lessonProg(l.id).piano); }
function currentLesson() { return LESSONS.find(l => lessonUnlocked(l) && !lessonProg(l.id).done) || null; }

/* ---------- Morceaux (domaine public) ---------- */
function parseTrack(str, hand, startBeat = 0) {
  const ev = []; let t = startBeat;
  str.replace(/\|/g, ' ').split(/\s+/).filter(Boolean).forEach(tok => {
    const [nm, d] = tok.split(':'), dur = d ? parseFloat(d) : 1;
    if (nm !== 'R') nm.split('+').forEach(n => ev.push({ start: t, dur, m: parseNote(n), hand }));
    t += dur;
  });
  return ev;
}

const GOOD = ['Bravo !', 'Exact !', 'Parfait !', 'Bien joué !', 'Juste !'];
const IV_LABEL = { 1: 'Seconde mineure', 2: 'Seconde majeure', 3: 'Tierce mineure', 4: 'Tierce majeure', 5: 'Quarte juste', 6: 'Triton', 7: 'Quinte juste', 8: 'Sixte mineure', 9: 'Sixte majeure', 10: 'Septième mineure', 11: 'Septième majeure', 12: 'Octave' };
const NAT_PC = [0, 2, 4, 5, 7, 9, 11];
const DUR_NAME = { w: 'ronde', h: 'blanche', q: 'noire', e: 'croche' };
const DUR_BEATS = { w: 4, h: 2, q: 1, e: 0.5 };

function pickNoRepeat(pool, last) { if (pool.length < 2) return pool[0]; let x; do { x = pick(pool); } while (x === last); return x; }
function parseRhythm(pattern) {
  const ev = []; let t = 0;
  pattern.split(/\s+/).filter(Boolean).forEach(tok => {
    const d = tok[0], rest = tok.includes('r'), dot = tok.includes('.'), dur = DUR_BEATS[d] * (dot ? 1.5 : 1);
    ev.push({ start: t, dur, rest, d, dot }); t += dur;
  });
  return { events: ev, beats: t };
}
const rhythmNotes = ev => ev.map(e => ({ m: 71, dur: e.d, rest: e.rest, dot: e.dot }));
function nameChoices(m, pool) {
  const correct = pcOf(m), universe = uniq(NAT_PC.concat(pool.map(pcOf)));
  const d = shuffle(universe.filter(p => p !== correct)).slice(0, 3);
  return shuffle([correct].concat(d)).map(pc => ({ pc, label: noteName(pc) }));
}

function expandStep(st) {
  const out = [], n = st.n || 1;
  switch (st.t) {
    case 'tapGroup': {
      const [a, b] = st.range;
      for (let i = 0; i < n; i++) {
        const two = i % 2 === 0, pcs = two ? [1, 3] : [6, 8, 10];
        const ok = BLACKS(a, b).filter(m => pcs.includes(pcOf(m)));
        out.push({ t: 'tapKey', prompt: 'Touche une noire du groupe de ' + (two ? '2' : '3'), ok, range: [a, b], labels: 'none', name: 'une touche noire du groupe de ' + (two ? '2' : '3') });
      }
      break; }
    case 'findKey': {
      let last = null;
      for (let i = 0; i < n; i++) {
        const m = pickNoRepeat(st.pool, last); last = m;
        const [a, b] = st.range;
        let ok;
        if (st.onlyExact) ok = st.exact; else { ok = []; for (let k = a; k <= b; k++) if (pcOf(k) === pcOf(m)) ok.push(k); }
        const nm = st.showBoth ? noteBoth(m) : noteName(m);
        out.push({ t: 'tapKey', prompt: st.prompt ? st.prompt + (st.pool.length > 3 || st.showBoth ? ' : ' + nm : '') : 'Touche : ' + nm, ok, range: st.range, labels: st.labels || 'c', name: nm, srsNote: null });
      }
      break; }
    case 'nameNote': {
      let last = null;
      for (let i = 0; i < n; i++) {
        const m = pickNoRepeat(st.pool, last); last = m;
        out.push({ t: 'nameNote', clef: st.clef, m, choices: nameChoices(m, st.pool), stat: ['read', st.clef + ':' + m], srs: st.srs ? ['read', st.clef + ':' + m] : null });
      }
      break; }
    case 'staffKey': {
      let last = null;
      for (let i = 0; i < n; i++) {
        const m = pickNoRepeat(st.pool, last); last = m;
        out.push({ t: 'staffKey', clef: st.clef, m, range: st.range, srs: st.srs ? ['read', st.clef + ':' + m] : null });
      }
      break; }
    case 'quizDur': {
      let last = null;
      for (let i = 0; i < n; i++) {
        const k = pickNoRepeat(st.kinds, last); last = k;
        const beats = ['q', 'h', 'w'], labels = ['1 temps', '2 temps', '4 temps'];
        const idx = beats.indexOf(k);
        out.push({ t: 'quiz', q: st.rest ? 'Combien de temps dure ce silence ?' : 'Combien de temps dure cette note ?', staff: { clef: 'none', lines: 1, notes: [{ m: 71, dur: k, rest: !!st.rest }], minW: 14, scale: 1.8 }, choices: labels, answer: idx, explain: 'Une ' + (st.rest ? { q: 'soupir', h: 'demi-pause', w: 'pause' }[k] : DUR_NAME[k]) + ' vaut ' + labels[idx] + '.', noRetry: false });
      }
      break; }
    case 'tapRhythm':
      st.patterns.slice(0, st.n || 99).forEach(p => out.push({ t: 'tapRhythm', pattern: p, bpm: st.bpm || 70, ts: st.ts || [4, 4], plain: st.plain, noRetry: true, stat: ['rhythm', 'r' + (st.bpm || 70)] }));
      break;
    case 'fingers':
      for (let i = 0; i < n; i++) out.push({ t: 'fingers', hand: st.hand || 'R', seq: st.seqs[i % st.seqs.length], mode: st.mode || 'tap', noRetry: true, stat: ['fingers', 'f'] });
      break;
    case 'playChord':
      st.targets.forEach(tg => out.push({ t: 'playChord', notes: tg, title: st.title }));
      break;
    case 'earHL': case 'earNote': case 'earInterval': case 'earQuality': case 'earProg': case 'echo':
      for (let i = 0; i < n; i++) out.push(earItem(st.t, st));
      break;
    default:
      out.push(Object.assign({}, st));
  }
  return out;
}
function expandSteps(steps) { return steps.flatMap(expandStep); }

function earItem(kind, o = {}) {
  switch (kind) {
    case 'earHL': {
      const a = 55 + rnd(14), gap = (o.small ? 2 : 4) + rnd(o.small ? 4 : 9), up = Math.random() < 0.5, b = clamp(up ? a + gap : a - gap, 48, 84);
      return { t: 'earHL', a, b, stat: ['ear', 'hl'] };
    }
    case 'earNote': {
      const pool = o.pool || C_POS, m = pick(pool);
      return { t: 'earNote', ref: 60, m, range: o.range || [60, 72], stat: ['ear', 'note'] };
    }
    case 'earInterval': {
      const set = o.set || [4, 7, 12], semis = pick(set);
      const mode = o.mode || (set.length < 4 ? 'asc' : pick(['asc', 'asc', 'desc', 'harm']));
      const root = 52 + rnd(14);
      return { t: 'earInterval', root, semis, mode, set, stat: ['ear', 'interval'] };
    }
    case 'earQuality': {
      const major = Math.random() < 0.5, root = 53 + rnd(12), kind2 = o.kind || 'chord';
      return { t: 'earQuality', major, root, kind: kind2, stat: ['ear', kind2 === 'chord' ? 'chord' : 'scale'] };
    }
    case 'earProg': {
      const deg = pick(['I', 'IV', 'V']);
      return { t: 'earProg', deg, stat: ['ear', 'prog'] };
    }
    case 'echo': {
      const pool = o.pool || C_POS, len = o.len || 3, seq = []; let last = null;
      for (let i = 0; i < len; i++) { const m = pickNoRepeat(pool, last); seq.push(m); last = m; }
      return { t: 'echo', seq, pool, stat: ['ear', 'echo'], noRetry: false };
    }
  }
}

/* ---------- Visuels pédagogiques ---------- */
function widenRange(a, b, minWhites) { // élargit par octaves pour que le clavier pleine largeur garde des touches de taille raisonnable
  const count = (x, y) => { let n = 0; for (let m = x; m <= y; m++) if (!isBlack(m)) n++; return n; };
  let lo = a, hi = b, up = true;
  while (count(lo, hi) < minWhites) {
    if (up && hi + 12 <= 96) hi += 12; else if (lo - 12 >= 24) lo -= 12; else if (hi + 12 <= 108) hi += 12; else break;
    up = !up;
  }
  return [lo, hi];
}

function labelNotes(notes) { return (notes || []).map(n => Object.assign({}, n, n.lab ? { label: noteName(Array.isArray(n.m) ? n.m[0] : n.m) } : {})); }
function buildViz(it, ctx) {
  const box = h('div', { class: 'stack' });
  if (it.kb) {
    const k = it.kb, rg = widenRange(k.from, k.to, 14), kb = Keyboard({ from: rg[0], to: rg[1], labels: k.labels || 'c' });
    (k.hl || []).forEach(m => kb.mark(m, 'target'));
    if (k.groups) { for (let m = rg[0]; m <= rg[1]; m++) if (isBlack(m)) kb.mark(m, [1, 3].includes(pcOf(m)) ? 'g1' : 'g2'); }
    if (k.fingers) Object.entries(k.fingers).forEach(([m, f]) => kb.setFinger(parseInt(m, 10), f));
    if (ctx) { ctx.mountKb(kb.el); ctx.onCleanup(() => kb.destroy()); } else box.append(h('div', { class: 'kbwrap' }, kb.el));
    if (k.groups) box.append(h('p', { class: 'muted small', style: { textAlign: 'center' } }, 'Bleu : groupe de 2 touches noires · Orange : groupe de 3'));
    else box.append(h('p', { class: 'muted small', style: { textAlign: 'center' } }, 'Touche le clavier pour l’entendre.'));
  }
  if (it.staff) box.append(h('div', { class: 'paper' }, staffEl(Object.assign({}, it.staff, { notes: labelNotes(it.staff.notes) }))));
  if (it.fingersViz) {
    const nm = ['pouce', 'index', 'majeur', 'annulaire', 'auriculaire'];
    box.append(h('div', { class: 'fingerrow' }, [1, 2, 3, 4, 5].map(i => h('div', null, h('b', null, i), h('span', null, nm[i - 1])))));
  }
  if (it.rests) {
    const r = [['q', 'Soupir · 1 temps'], ['h', 'Demi-pause · 2 temps'], ['w', 'Pause · 4 temps'], ['e', 'Demi-soupir · ½ temps']];
    box.append(h('div', { class: 'grid' }, r.map(x => h('div', { class: 'paper' }, staffEl({ clef: 'none', lines: 1, notes: [{ rest: true, dur: x[0] }], sp: 10, scale: 1.4, minW: 9 }), h('b', { style: { fontSize: '14px', marginTop: '4px' } }, x[1])))));
  }
  return box.children.length ? box : null;
}

function runSession(o) {

    const items = o.items.slice(), scoredTotal = items.filter(i => i.t !== 'learn').length;
    let first = 0, xp = 0, wrongs = 0;
    const t0 = Date.now();
    const sh = openSheet({ title: o.title, color, confirmClose: { title: 'Quitter la séance ?', text: 'Ce que tu as fait dans cette séance ne sera pas enregistré.' }, onClose: () => { cleanup(); if (!finished) resolve(null); } });

        onCleanup(f) { cleaners.push(f); },
        mountKb(el) { sh.kbslot.innerHTML = ''; sh.kbslot.append(el); sh.card.classList.add('kbmode'); },
        footBtn(label, fn, cls) { const b = h('button', { class: 'btn primary big ' + (cls || ''), onclick: fn }, label); sh.foot.innerHTML = ''; sh.foot.append(b); return b; },

            h('button', { class: 'btn primary', onclick: () => { idx++; show(); } }, 'Continuer'));

          sh.foot.innerHTML = '';

      const minutes = (Date.now() - t0) / 60000;
      bar.firstChild.style.width = '100%'; counter.textContent = items.length + ' / ' + items.length;
      touchDay(minutes, xp);
      const res = { acc, stars, xp, first, total: scoredTotal, wrongs, minutes };
      if (o.onFinish) o.onFinish(res);
      sh.body.innerHTML = ''; sh.foot.innerHTML = '';
      const box = h('div', { class: 'stage', style: { alignItems: 'center', textAlign: 'center', paddingTop: '30px', gap: '16px' } },
        starsEl(stars), h('div', { class: 'resbig' }, scoredTotal ? Math.round(acc * 100) + ' %' : 'Terminé'),
        h('p', { class: 'muted' }, scoredTotal ? (first + ' réussite' + (first > 1 ? 's' : '') + ' du premier coup sur ' + scoredTotal + ' · +' + xp + ' XP') : '+' + xp + ' XP'));

}

/* --- Rythme à taper --- */
RENDER.tapRhythm = (it, ctx) => {
  const { events, beats: total } = parseRhythm(it.pattern), ts = it.ts, beat = 60 / it.bpm, bpb = ts[0] * 4 / ts[1];
  const barBeats = bpb;
  ctx.root.append(h('div', { class: 'q' }, it.plain ? 'Tape sur chaque temps' : 'Tape le rythme', h('small', null, it.bpm + ' bpm · ' + ts[0] + '/' + ts[1])));
  ctx.root.append(h('div', { class: 'paper' }, staffEl({ clef: 'none', lines: 1, ts, notes: rhythmNotes(events), final: true, minW: 24, scale: 2 })));
  const dots = h('div', { class: 'beats' }, Array.from({ length: ts[0] }, (_, i) => h('i', { class: i === 0 ? 'acc' : '' })));
  const info = h('p', { class: 'muted', style: { textAlign: 'center', minHeight: '24px' } }, 'Écoute d’abord, puis lance-toi.');
  const zone = h('div', { class: 'tapzone', 'aria-label': 'Zone de tap' }, 'Tape ici');
  const listen = h('button', { class: 'btn', onclick: () => doListen() }, icon('speaker'), 'Écouter');
  const go = h('button', { class: 'btn primary', onclick: () => doRun() }, icon('play'), 'À moi de jouer');
  ctx.root.append(dots, h('div', { class: 'row', style: { justifyContent: 'center' } }, listen, go), zone, info);
  let metro = null, taps = [], running = false, timers = [];
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const pulse = i => { $$('i', dots).forEach((d, k) => d.classList.toggle('on', k === i)); };
  function doListen() {
    if (running) return;
    Snd.unlock(); const c = Snd.ctx, t0 = c.currentTime + 0.12;
    for (let i = 0; i < ts[0]; i++) Snd.click(t0 + i * beat, i === 0);
    const tp = t0 + ts[0] * beat;
    events.forEach(e => { if (!e.rest) Snd.noteOn(76, 0.7, { at: tp + e.start * beat, dur: Math.min(0.4, e.dur * beat * 0.9) }); });
    for (let i = 0; i < Math.ceil(total); i++) Snd.click(tp + i * beat, i % bpb === 0, 'beep');
    info.textContent = 'Compte quatre, puis écoute…'.replace('quatre', ts[0] === 3 ? 'trois' : 'quatre');
  }
  function doRun() {
    if (running || ctx.answered) return;
    Snd.unlock(); const c = Snd.ctx; running = true; taps = []; clearTimers();
    go.disabled = true; listen.disabled = true; info.textContent = 'Compte… puis tape !';
    metro = new Metro({ bpm: it.bpm, beats: ts[0], onBeat: (i, ab) => { pulse(i); if (ab === ts[0]) info.textContent = 'Vas-y !'; } });
    metro.start(c.currentTime + 0.2);
    const T0 = metro.t0, tp = T0 + ts[0] * beat;
    const endMs = (tp - c.currentTime + total * beat + beat * 0.8) * 1000;
    ctx.onCleanup(() => { if (metro) metro.stop(); clearTimers(); });
    timers.push(setTimeout(() => {
      metro.stop(); running = false; pulse(-1);
      evaluate(tp);
    }, endMs));
  }
  function evaluate(tp) {
    const exp = events.filter(e => !e.rest).map(e => Snd.toPerf(tp + e.start * beat));
    const lat = cfg().latency, tps = taps.map(t => t - lat), used = new Set(), devs = [];
    exp.forEach(et => {
      let bi = -1, bd = 1e9;
      tps.forEach((t, i) => { if (used.has(i)) return; const d = Math.abs(t - et); if (d < bd) { bd = d; bi = i; } });
      if (bi >= 0 && bd <= Math.min(330, beat * 1000 * 0.45)) { used.add(bi); devs.push(tps[bi] - et); } else devs.push(null);
    });
    const matched = devs.filter(d => d != null), extra = tps.length - used.size;
    const good = matched.filter(d => Math.abs(d) <= 140).length;
    const avg = matched.length ? matched.reduce((a, b) => a + b, 0) / matched.length : 0;
    const ok = exp.length > 0 && good >= Math.ceil(exp.length * 0.8) && extra <= 1;
    const side = Math.abs(avg) < 25 ? 'pile dans le temps' : (avg > 0 ? 'plutôt en retard' : 'plutôt en avance');
    const msg = good + '/' + exp.length + ' notes bien placées' + (matched.length ? ' · ' + side + ' (' + Math.round(avg) + ' ms)' : '') + (extra > 0 ? ' · ' + extra + ' tap en trop' : '') + '.';
    info.textContent = msg;
    ctx.answer(ok, msg);
  }
  const down = e => {
    if (!running) return; e.preventDefault();
    taps.push(e.timeStamp || performance.now());
    zone.classList.add('hit'); setTimeout(() => zone.classList.remove('hit'), 90);
    Snd.noteOn(81, 0.5, { dur: 0.12 });
  };
  zone.addEventListener('pointerdown', down);
  ctx.onCleanup(() => { if (metro) metro.stop(); clearTimers(); });
};

RENDER.fingers = (it, ctx) => {

  let pos = 0, errors = 0; const downSet = new Set(); let started = it.mode !== 'hold';
  ctx.root.append(h('div', { class: 'q' }, 'Main ' + (it.hand === 'R' ? 'droite' : 'gauche'), h('small', null, it.mode === 'hold' ? 'Pose les 5 doigts, puis lève et repose seulement le doigt demandé' : 'Tape les doigts dans l’ordre indiqué')));
  const chips = h('div', { class: 'seqchips' }, it.seq.map(f => h('span', null, f)));
  const pads = h('div', { class: 'pads' }, order.map(f => h('div', { class: 'pad', 'data-f': f }, f)));
  const info = h('p', { class: 'muted', style: { textAlign: 'center', minHeight: '24px' } }, it.mode === 'hold' ? 'Pose tes 5 doigts sur les pastilles.' : '');
  ctx.root.append(chips, pads, info);
  const padEl = f => pads.querySelector('[data-f="' + f + '"]');
  function mark() { $$('.pad', pads).forEach(p => p.classList.remove('target')); chips.querySelectorAll('span').forEach((s, i) => { s.classList.toggle('cur', i === pos); s.classList.toggle('done', i < pos); }); if (pos < it.seq.length && started) padEl(it.seq[pos]).classList.add('target'); }
  mark();
  const ids = new Map();
  pads.addEventListener('pointerdown', e => {
    const p = e.target.closest('.pad'); if (!p || ctx.answered) return; e.preventDefault();
    const f = parseInt(p.dataset.f, 10); ids.set(e.pointerId, f); p.classList.add('down'); downSet.add(f);
    try { pads.setPointerCapture(e.pointerId); } catch (er) { /* ok */ }
    Snd.noteOn(60 + f * 2, 0.45, { dur: 0.15 });
    if (!started) { if (downSet.size === 5) { started = true; info.textContent = 'Parfait. C’est parti.'; mark(); } return; }
